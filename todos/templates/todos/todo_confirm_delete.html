{% extends 'todos/base.html' %}

{% block content %}
    <h1>Delete Todo</h1>
    <p>Are you sure you want to delete "<strong>{{ todo.title }}</strong>"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'todo_list' %}" style="margin-left:10px;">Cancel</a>
    </form>
{% endblock %}
